; Verify field names with `writefreely config start` for your version
[server]
hidden_host =
port        = 8080
bind        = 127.0.0.1

[database]
type     = mysql
username = avnadmin
password = CHANGE_ME
database = writefreely
host     = YOUR-SERVICE.aivencloud.com
port     = 12345
tls      = true

[app]
site_name       = My Publication
host            = https://write.example.com
single_user     = false   ; multiple publications need multi-user mode
max_blogs       = 10      ; publications (collections) per user; verify the field in your version
open_registration = false
federation      = true
public_stats    = false
private         = false
