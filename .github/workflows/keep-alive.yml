# Optional: keeps a sleeping Render WriteFreely warm, so the first reader after a quiet spell
# does not wait through a cold start of about a minute.
#
# Off by default. It does nothing until the repository VARIABLE KEEP_ALIVE_URL is set
# (Settings -> Secrets and variables -> Actions -> Variables), for example:
#     https://<your-writefreely>.onrender.com/api/collections/<alias>/posts?page=999
# That URL returns an empty page, so it is cheap, but it still queries the database.
#
# Read before enabling:
#  * Render's free plan gives 750 instance hours a month, and one service awake 24/7 uses
#    about 744 of them. Check your plan before enabling this.
#  * GitHub cron is best-effort (runs can be delayed by minutes), and GitHub disables scheduled
#    workflows in a repository with no activity for 60 days.
#  * A paid always-on instance is the reliable fix; this is the free workaround.
name: Keep WriteFreely awake

on:
  schedule:
    - cron: "*/10 * * * *"   # Render free services sleep after ~15 minutes without traffic
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping WriteFreely
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ]; then
            echo "::notice::KEEP_ALIVE_URL is not set; nothing to do."
            exit 0
          fi
          case "$KEEP_ALIVE_URL" in
            https://*) ;;
            *) echo "::error::KEEP_ALIVE_URL must start with https://"; exit 1 ;;
          esac
          # A cold start can take a minute or more: allow a long wait, retry transient errors.
          curl --fail --silent --show-error \
            --max-time 150 --retry 3 --retry-delay 15 --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$KEEP_ALIVE_URL"
