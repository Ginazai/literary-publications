name: CD

# Deploys to Render (production) after CI succeeded on a push to the default branch. The review
# happens on the pull request you merged; there is no separate staging environment.
#
#   merge -> CI -> deploy -> verify the new commit is really serving -> 5 minute soak
#
# Render keeps the old version running if a deploy fails to build or boot, so a failed deploy
# leaves the site on its previous version and turns this workflow red (you get an email).
#
# ROLLBACK: Actions -> CD -> Run workflow -> commit = an older commit on the default branch
# (full or short SHA, or the sha-... form). It goes through the same deploy and verification.
#
# OPTIONAL manual approval before every deploy: Settings -> Environments -> production ->
# Required reviewers (free for public repositories).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      commit:
        description: "Rollback: a commit already on the default branch (e.g. 1a2b3c4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Decides WHICH commit to deploy and whether to deploy at all.
  resolve:
    name: Which commit?
    # CD never runs for PRs or forks: only a successful CI run from a push to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
      deploy: ${{ steps.pick.outputs.deploy }}
    env:
      EVENT: ${{ github.event_name }}
      INPUT_COMMIT: ${{ inputs.commit }}
      RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: pick
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            want="${INPUT_COMMIT#sha-}"
            commit=$(git rev-parse --verify --quiet "${want}^{commit}") \
              || { echo "::error::'$INPUT_COMMIT' is not a commit in this repository"; exit 1; }
            echo "commit=$commit" >> "$GITHUB_OUTPUT"; echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A slow CI run must not deploy an older commit over a newer one.
          tip=$(git rev-parse "origin/${DEFAULT_BRANCH}")
          echo "commit=$RUN_COMMIT" >> "$GITHUB_OUTPUT"
          if [ "$tip" = "$RUN_COMMIT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Superseded::${RUN_COMMIT:0:7} is no longer the tip of ${DEFAULT_BRANCH} (${tip:0:7}); the newer commit's own run will deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  production:
    name: Production
    needs: resolve
    if: ${{ needs.resolve.outputs.deploy == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-render.yml
    with:
      environment: production
      commit: ${{ needs.resolve.outputs.commit }}
      soak_minutes: 5   # keep probing for 5 minutes after the deploy is verified
    secrets: inherit
