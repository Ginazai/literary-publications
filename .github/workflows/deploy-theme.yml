# Pushes the theme to Ghost on every change under theme/.
# Needs repo secrets from Ghost Admin > Settings > Integrations > Add custom integration:
#   GHOST_ADMIN_API_URL  (e.g. https://yourdomain.com)
#   GHOST_ADMIN_API_KEY
name: Deploy theme
on:
  push:
    branches: [main]
    paths: ["theme/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TryGhost/action-deploy-theme@v1
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          theme-name: literary-theme
          dir: theme
