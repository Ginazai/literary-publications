# Render Blueprint: one production environment (two services).
#
# DEPLOYS ARE DRIVEN BY GITHUB ACTIONS (docs/ci-cd.md), not by Render's git auto-deploy:
#   * every service sets `autoDeployTrigger: "off"`, otherwise a push would deploy without CI
#   * the pipeline calls each service's deploy hook with `&ref=<commit>` (see .github/workflows)
# scripts/ci/check-blueprint.py enforces these rules in CI.
#
services:
  - type: web
    name: writefreely
    runtime: docker
    plan: free            # free = sleeps after 15 min idle, no disk. Use a paid plan for production.
    dockerfilePath: ./ops/render/Dockerfile
    dockerContext: ./ops/render
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: PUBLIC_URL
        sync: false       # e.g. https://writefreely-xxxx.onrender.com (set after first deploy)
      - key: DB_HOST
        sync: false       # TiDB Cloud: gateway01.<region>.prod.aws.tidbcloud.com (Connect dialog)
      - key: DB_PORT
        sync: false       # 4000
      - key: DB_USER
        sync: false       # TiDB Cloud usernames carry a prefix: <prefix>.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: writefreely
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_NAME
        value: test
      - key: AUTHOR_NAME
        value: Rafael Caballero
  - type: web
    name: reader
    runtime: static
    rootDir: frontend
    # The last step writes dist/version.json so the pipeline can confirm which commit is live.
    buildCommand: npm ci && npm run build && printf '{"commit":"%s"}\n' "${RENDER_GIT_COMMIT:-unknown}" > dist/version.json
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"       # matches CI; the unit tests need Node >= 22.6
      - key: VITE_WF_ALIASES
        value: test
    # The browser only ever talks to this site (same origin): no CORS, and the CSP can say
    # connect-src 'self'. Render proxies exactly two READ-ONLY paths to WriteFreely; every other
    # /wf/... path (login, admin, writes) falls through to the SPA and never reaches WriteFreely.
    # EDIT the host below to your WriteFreely service URL (Render dashboard). Rules apply top-down.
    # scripts/ci/check-blueprint.py enforces this allowlist, https, and the CSP hash.
    routes:
      - type: rewrite
        source: /wf/nodeinfo
        destination: https://writefreely-0ke4.onrender.com/api/nodeinfo
      - type: rewrite
        source: /wf/collections/*
        destination: https://writefreely-0ke4.onrender.com/api/collections/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-zNY7Ew7CDhcveSMxkAKAT/eEkVj7K1xVPk3iVQJEI+U='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
