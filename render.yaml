# Render Blueprint: production + staging.
#
# DEPLOYS ARE DRIVEN BY GITHUB ACTIONS (docs/ci-cd.md), not by Render's git auto-deploy:
#   * every service sets `autoDeployTrigger: "off"`, otherwise a push would bypass staging and review
#   * the pipeline calls each service's deploy hook with `&ref=<commit>` (see .github/workflows)
# scripts/ci/check-blueprint.py enforces these rules in CI.
#
# Staging uses its own WriteFreely service AND its own database (DB_NAME), never production's.
# Aiven free tier: create a second database in the same service (see docs/ci-cd.md).
services:
  # ───────────────────────────── production ─────────────────────────────
  - type: web
    name: writefreely
    runtime: docker
    plan: free            # free = sleeps after 15 min idle, no disk. Use a paid plan for production.
    dockerfilePath: ./ops/render/Dockerfile
    dockerContext: ./ops/render
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: PUBLIC_URL
        sync: false       # e.g. https://writefreely-xxxx.onrender.com (set after first deploy)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_CA_CERT
        sync: false       # paste the full contents of Aiven's CA certificate (ca.pem)
      - key: DB_NAME
        value: writefreely
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_NAME
        value: test
      - key: AUTHOR_NAME
        value: Rafael Caballero
  - type: web
    name: reader
    runtime: static
    rootDir: frontend
    # The last step writes dist/version.json so the pipeline can confirm which commit is live.
    buildCommand: npm ci && npm run build && printf '{"commit":"%s"}\n' "${RENDER_GIT_COMMIT:-unknown}" > dist/version.json
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"       # matches CI; the unit tests need Node >= 22.6
      - key: VITE_WF_ALIASES
        value: test
      - key: VITE_WF_BASE
        sync: false       # e.g. https://writefreely-xxxx.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ────────────────────────────── staging ───────────────────────────────
  - type: web
    name: writefreely-staging
    runtime: docker
    plan: free
    dockerfilePath: ./ops/render/Dockerfile
    dockerContext: ./ops/render
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: PUBLIC_URL
        sync: false       # e.g. https://writefreely-staging-xxxx.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: DB_NAME
        value: writefreely_staging   # must differ from production's DB_NAME (checked in CI)
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_NAME
        value: test (staging)
      - key: AUTHOR_NAME
        value: Rafael Caballero
  - type: web
    name: reader-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build && printf '{"commit":"%s"}\n' "${RENDER_GIT_COMMIT:-unknown}" > dist/version.json
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_WF_ALIASES
        value: test
      - key: VITE_WF_BASE
        sync: false       # e.g. https://writefreely-staging-xxxx.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
