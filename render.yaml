services:
  - type: web
    name: writefreely
    runtime: docker
    plan: free            # free = sleeps after 15 min idle, no disk. Use a paid plan for production.
    dockerfilePath: ./ops/render/Dockerfile
    dockerContext: ./ops/render
    envVars:
      - key: PUBLIC_URL
        sync: false       # e.g. https://writefreely-xxxx.onrender.com (set after first deploy)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: writefreely
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_NAME
        value: test
      - key: AUTHOR_NAME
        value: Rafael Caballero
  - type: web
    name: reader
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WF_ALIASES
        value: test
      - key: VITE_WF_BASE
        sync: false       # e.g. https://writefreely-xxxx.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
