<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#1A1714" />
<meta name="description" content="Personal essays, read as a paged book." />
<title>test</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<script>
/* Set the theme before first paint so there is no flash. Mirrors src/lib/theme.ts. */
(function () {
  var t = 'dark';
  try {
    var s = localStorage.getItem('theme');
    t = s === 'light' || s === 'dark' ? s : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#E7E3D7' : '#1A1714');
})();
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
